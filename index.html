    <style>
        :root {
            --phosphor-main: #33ff00;
            --phosphor-dim: #1a8000;
            --alert-red: #ff003c;
            --bg-color: #050505;
            --scanline-color: rgba(0, 0, 0, 0.5);
            --crt-flicker: rgba(51, 255, 0, 0.02);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: #000;
            color: var(--phosphor-main);
            font-family: 'VT323', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            font-size: 24px;
        }

        /* --- CRT SCREEN EFFECTS --- */
        .crt-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle, #111 0%, #000 100%);
            overflow: hidden;
            padding: 40px;
            display: flex;
            flex-direction: column;
        }

        /* Scanlines */
        .crt-container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* Screen Flicker */
        .crt-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: rgba(18, 16, 16, 0.1);
            opacity: 0;
            z-index: 100;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% {
                opacity: 0.01;
            }

            50% {
                opacity: 0.05;
            }

            100% {
                opacity: 0.01;
            }
        }

        /* --- UI LAYOUT --- */
        header {
            border-bottom: 2px solid var(--phosphor-main);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            text-shadow: 0 0 5px var(--phosphor-main);
        }

        .status-badge {
            background: var(--phosphor-main);
            color: #000;
            padding: 0 8px;
            animation: blink 1s step-end infinite;
        }

        #terminal-output {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
            font-size: 22px;
            /* Scrollbar styling */
            scrollbar-width: thin;
            scrollbar-color: var(--phosphor-main) #000;
        }

        #terminal-output::-webkit-scrollbar {
            width: 10px;
        }

        #terminal-output::-webkit-scrollbar-track {
            background: #000;
            border-left: 1px solid var(--phosphor-dim);
        }

        #terminal-output::-webkit-scrollbar-thumb {
            background: var(--phosphor-main);
        }

        .msg-row {
            display: flex;
            flex-direction: column;
            animation: typeLine 0.1s ease-out;
        }

        #fractal-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            opacity: 0.15;
            /* Keep it subtle so you can read the text */
            image-rendering: pixelated;
            pointer-events: none;
            filter: blur(1px) contrast(150%);
        }

        .user-line {
            color: #fff;
            text-shadow: 0 0 2px #fff;
        }

        .user-line::before {
            content: ">> USER_INPUT: ";
            opacity: 0.7;
            font-size: 0.8em;
        }

        .sys-line {
            color: var(--phosphor-main);
            margin-top: 5px;
            white-space: pre-wrap;
            line-height: 1.2;
        }

        .sys-line::before {
            content: ">> Roshan: ";
            opacity: 0.7;
            font-size: 0.8em;
        }

        /* ERROR STATE STYLES */
        .error-msg {
            color: var(--alert-red) !important;
            text-shadow: 2px 0 #fff, -2px 0 #000;
            /* Glitch effect */
            font-weight: bold;
            border: 1px solid var(--alert-red);
            padding: 10px;
            background: rgba(255, 0, 60, 0.1);
        }

        .error-glitch {
            display: inline-block;
            animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
        }

        @keyframes glitch-skew {
            0% {
                transform: translate(0);
            }

            20% {
                transform: translate(-2px, 2px);
            }

            40% {
                transform: translate(-2px, -2px);
            }

            60% {
                transform: translate(2px, 2px);
            }

            80% {
                transform: translate(2px, -2px);
            }

            100% {
                transform: translate(0);
            }
        }

        /* --- INPUT AREA --- */
        .input-wrapper {
            margin-top: 20px;
            border: 2px solid var(--phosphor-main);
            padding: 15px;
            display: flex;
            align-items: center;
            background: rgba(0, 20, 0, 0.6);
            box-shadow: 0 0 10px var(--phosphor-dim);
        }

        .prompt-char {
            margin-right: 10px;
            animation: blink 1s infinite;
        }

        input {
            background: transparent;
            border: none;
            color: var(--phosphor-main);
            font-family: 'VT323', monospace;
            font-size: 24px;
            width: 100%;
            outline: none;
            text-transform: uppercase;
            text-shadow: 0 0 5px var(--phosphor-main);
        }

        /* SCREEN SHAKE ANIMATION */
        .shake {
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* Loading Bar */
        .loading-bar {
            width: 100%;
            height: 20px;
            border: 1px solid var(--phosphor-main);
            margin-top: 5px;
            position: relative;
        }

        .loading-fill {
            height: 100%;
            background: var(--phosphor-main);
            width: 0%;
            transition: width 0.2s;
        }

        /* Responsive */
        @media(max-width: 600px) {
            body {
                font-size: 18px;
            }

            .crt-container {
                padding: 15px;
            }
        }

        /* SCARY CHECK STYLES */
        .breach-container {
            border: 3px solid var(--alert-red);
            background: linear-gradient(135deg, rgba(255, 0, 60, 0.2) 0%, rgba(0, 0, 0, 0.9) 50%, rgba(255, 0, 60, 0.2) 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
            animation: breach-pulse 0.5s ease-in-out infinite alternate;
        }

        .breach-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 60, 0.4), transparent);
            animation: scan-line 2s linear infinite;
        }

        @keyframes breach-pulse {
            0% {
                box-shadow: 0 0 20px rgba(255, 0, 60, 0.5), inset 0 0 30px rgba(255, 0, 60, 0.1);
            }

            100% {
                box-shadow: 0 0 40px rgba(255, 0, 60, 0.8), inset 0 0 50px rgba(255, 0, 60, 0.2);
            }
        }

        @keyframes scan-line {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        .skull-ascii {
            color: var(--alert-red);
            font-size: 12px;
            line-height: 1;
            text-align: center;
            text-shadow: 0 0 10px var(--alert-red), 0 0 20px var(--alert-red);
            animation: skull-flicker 0.1s infinite;
        }

        @keyframes skull-flicker {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.8;
            }

            25%,
            75% {
                opacity: 0.9;
                transform: translateX(1px);
            }
        }

        .breach-header {
            font-size: 28px;
            color: var(--alert-red);
            text-align: center;
            text-shadow: 0 0 10px var(--alert-red), 0 0 20px var(--alert-red), 0 0 40px var(--alert-red);
            animation: warning-blink 0.3s infinite;
            margin-bottom: 15px;
        }

        @keyframes warning-blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            font-size: 14px;
            border: 1px solid var(--alert-red);
            padding: 10px;
            background: rgba(0, 0, 0, 0.7);
        }

        .data-key {
            color: #ff6b6b;
            text-shadow: 0 0 5px #ff6b6b;
        }

        .data-value {
            color: #fff;
            text-shadow: 0 0 3px #fff;
            word-break: break-all;
        }

        .countdown-bar {
            height: 8px;
            background: linear-gradient(90deg, var(--alert-red), #ff6b6b, var(--alert-red));
            margin-top: 15px;
            animation: countdown-shrink 5s linear forwards;
        }

        @keyframes countdown-shrink {
            0% {
                width: 100%;
            }

            100% {
                width: 0%;
            }
        }

        /* MATRIX RAIN STYLES */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #matrix-canvas.active {
            opacity: 1;
            pointer-events: all;
        }

        .matrix-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1001;
            color: #00ff00;
            font-size: 32px;
            text-align: center;
            text-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00;
            animation: matrix-text-glow 1s ease-in-out infinite alternate;
        }

        @keyframes matrix-text-glow {
            0% {
                text-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00;
            }

            100% {
                text-shadow: 0 0 30px #00ff00, 0 0 60px #00ff00, 0 0 80px #00ff00;
            }
        }

        /* === /POSSESSED STYLES === */
        .possessed-mode {
            animation: possessed-shake 0.05s infinite, color-distort 0.1s infinite;
        }

        @keyframes possessed-shake {

            0%,
            100% {
                transform: translate(0);
            }

            25% {
                transform: translate(-2px, 1px) rotate(-0.5deg);
            }

            50% {
                transform: translate(2px, -1px) rotate(0.5deg);
            }

            75% {
                transform: translate(-1px, -1px) rotate(-0.25deg);
            }
        }

        @keyframes color-distort {
            0% {
                filter: hue-rotate(0deg);
            }

            50% {
                filter: hue-rotate(180deg) saturate(2);
            }

            100% {
                filter: hue-rotate(360deg);
            }
        }

        .demonic-text {
            color: #ff0000 !important;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 40px #8b0000;
            animation: demonic-pulse 0.2s infinite;
            font-size: 28px;
        }

        @keyframes demonic-pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.02);
            }
        }

        /* === /SURVEILLANCE STYLES === */
        .webcam-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .webcam-frame {
            width: 640px;
            height: 480px;
            border: 4px solid #ff003c;
            background: linear-gradient(135deg, #111 0%, #000 100%);
            position: relative;
            box-shadow: 0 0 50px rgba(255, 0, 60, 0.5);
        }

        .rec-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ff003c;
            font-size: 24px;
            animation: rec-blink 1s infinite;
        }

        .rec-dot {
            width: 15px;
            height: 15px;
            background: #ff003c;
            border-radius: 50%;
            animation: rec-blink 1s infinite;
        }

        @keyframes rec-blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .webcam-static {
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 255, 255, 0.03) 2px,
                    rgba(255, 255, 255, 0.03) 4px);
            animation: static-move 0.1s infinite;
        }

        @keyframes static-move {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 0 4px;
            }
        }

        .face-box {
            position: absolute;
            border: 2px solid #00ff00;
            animation: face-scan 2s infinite;
        }

        @keyframes face-scan {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* === /COUNTDOWN STYLES === */
        .countdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #1a0000 0%, #000 100%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .countdown-number {
            font-size: 200px;
            color: #ff003c;
            text-shadow: 0 0 50px #ff003c, 0 0 100px #ff003c;
            animation: countdown-pulse 1s infinite;
        }

        @keyframes countdown-pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        .countdown-text {
            font-size: 36px;
            color: #ff6b6b;
            margin-top: 20px;
            text-align: center;
        }

        /* === /VIRUS STYLES === */
        .virus-cell {
            position: fixed;
            background: #00ff00;
            opacity: 0.8;
            z-index: 1500;
            animation: virus-spread 0.5s forwards;
            pointer-events: none;
        }

        @keyframes virus-spread {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 0.6;
            }
        }

        .virus-warning {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1600;
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #00ff00;
            padding: 40px;
            text-align: center;
            animation: virus-warning-pulse 0.5s infinite;
        }

        @keyframes virus-warning-pulse {

            0%,
            100% {
                box-shadow: 0 0 20px #00ff00;
            }

            50% {
                box-shadow: 0 0 50px #00ff00, 0 0 100px #00ff00;
            }
        }

        /* === /GHOST STYLES === */
        .ghost-message {
            position: fixed;
            color: rgba(255, 255, 255, 0.3);
            font-size: 48px;
            pointer-events: none;
            z-index: 1500;
            animation: ghost-float 5s forwards;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        @keyframes ghost-float {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }

            20% {
                opacity: 0.5;
            }

            80% {
                opacity: 0.3;
            }

            100% {
                opacity: 0;
                transform: translateY(-100px);
            }
        }

        .ghost-flicker {
            animation: ghost-screen-flicker 0.1s infinite;
        }

        @keyframes ghost-screen-flicker {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }

            25%,
            75% {
                opacity: 0.9;
            }
        }

        .ghost-face {
            position: fixed;
            font-size: 150px;
            color: rgba(255, 255, 255, 0.1);
            z-index: 1400;
            pointer-events: none;
            animation: ghost-face-appear 3s forwards;
        }

        @keyframes ghost-face-appear {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            50% {
                opacity: 0.3;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(1.5);
            }
        }

        /* === /HELP STYLES === */
        .help-panel {
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid var(--phosphor-main);
            padding: 20px;
            margin: 10px 0;
            box-shadow: 0 0 20px rgba(51, 255, 0, 0.3);
        }

        .help-title {
            color: var(--phosphor-main);
            font-size: 28px;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 0 0 10px var(--phosphor-main);
        }

        .help-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 8px;
            font-size: 16px;
        }

        .help-cmd {
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }

        .help-desc {
            color: #aaa;
        }

        /* === /BLACKOUT STYLES === */
        .blackout-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .blackout-text {
            color: #fff;
            font-size: 48px;
            opacity: 0;
            animation: blackout-reveal 3s forwards;
            text-align: center;
        }

        @keyframes blackout-reveal {
            0% {
                opacity: 0;
            }

            50% {
                opacity: 0.1;
            }

            100% {
                opacity: 0.8;
            }
        }

        /* === /GLITCH STYLES === */
        .glitch-mode {
            animation: heavy-glitch 0.1s infinite;
        }

        @keyframes heavy-glitch {
            0% {
                transform: translate(0) skew(0);
                filter: hue-rotate(0);
            }

            10% {
                transform: translate(-5px, 3px) skew(2deg);
                filter: hue-rotate(90deg);
            }

            20% {
                transform: translate(5px, -3px) skew(-2deg);
                filter: hue-rotate(180deg);
            }

            30% {
                transform: translate(-3px, -5px) skew(1deg);
                filter: hue-rotate(270deg);
            }

            40% {
                transform: translate(3px, 5px) skew(-1deg);
                filter: hue-rotate(360deg);
            }

            50% {
                transform: translate(-2px, 2px) skew(3deg);
                clip-path: inset(20% 0 30% 0);
            }

            60% {
                transform: translate(2px, -2px) skew(-3deg);
                clip-path: inset(40% 0 10% 0);
            }

            70% {
                transform: translate(-4px, 4px) skew(2deg);
                clip-path: inset(10% 0 50% 0);
            }

            80% {
                transform: translate(4px, -4px) skew(-2deg);
                clip-path: none;
            }

            90% {
                transform: translate(-1px, 1px) skew(1deg);
            }

            100% {
                transform: translate(0) skew(0);
                filter: hue-rotate(0);
            }
        }

        .glitch-bar {
            position: fixed;
            height: 5px;
            background: linear-gradient(90deg, #ff0000, #00ff00, #0000ff, #ff0000);
            z-index: 2000;
            pointer-events: none;
            animation: glitch-bar-move 0.05s infinite;
        }

        @keyframes glitch-bar-move {

            0%,
            100% {
                opacity: 1;
            }

            if (depth === 0) return;

            ctx.lineWidth = 0.5;

            // Draw the "Ghost" of the recursion
            ctx.strokeRect(x, y, size, size);

            // Recursive calls for the 4 corners
            drawFractal(x - offset, y - offset, newSize, depth - 1);
            drawFractal(x + size - offset, y - offset, newSize, depth - 1);
            drawFractal(x - offset, y + size - offset, newSize, depth - 1);
            drawFractal(x + size - offset, y + size - offset, newSize, depth - 1);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const columns = matrixCanvas.width / fontSize;

            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -100;

            const matrixMessages = [

            let charIndex = 0;

            // Create message overlay

            msgDiv.className = 'matrix-message';
            document.body.appendChild(msgDiv);

            function drawMatrix() {
                matrixCtx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);

                matrixCtx.fillStyle = '#0f0';
                matrixCtx.font = fontSize + 'px VT323';

                for (let i = 0; i < drops.length; i++) {
                    const char = charArray[Math.floor(Math.random() * charArray.length)];
                    const x = i * fontSize;
                    const y = drops[i] * fontSize;

                    // Brighter leading character
                    if (Math.random() > 0.98) {
                        matrixCtx.fillStyle = '#fff';
                    } else {
                        matrixCtx.fillStyle = `hsl(120, 100%, ${30 + Math.random() * 40}%)`;
                    }

                    matrixCtx.fillText(char, x, y);

                    if (y > matrixCanvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }

            // Typewriter effect for messages
            function typeMessage() {
                if (messageIndex < matrixMessages.length) {
                    if (charIndex < matrixMessages[messageIndex].length) {
                        currentMessage += matrixMessages[messageIndex][charIndex];
                        msgDiv.textContent = currentMessage;
                        charIndex++;
                        setTimeout(typeMessage, 100);
                    } else {
                        setTimeout(() => {
                            currentMessage = "";
                            charIndex = 0;
                            messageIndex++;
                            if (messageIndex < matrixMessages.length) {
                                setTimeout(typeMessage, 500);
                            }
                        }, 2000);
                    }
                }
            }

            const matrixInterval = setInterval(drawMatrix, 33);
