    <style>
        :root {
            --phosphor-main: #33ff00;
            --phosphor-dim: #1a8000;
            --alert-red: #ff003c;
            --bg-color: #050505;
            --scanline-color: rgba(0, 0, 0, 0.5);
            --crt-flicker: rgba(51, 255, 0, 0.02);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: #000;
            color: var(--phosphor-main);
            font-family: 'VT323', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            font-size: 24px;
        }

        /* --- CRT SCREEN EFFECTS --- */
        .crt-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle, #111 0%, #000 100%);
            overflow: hidden;
            padding: 40px;
            display: flex;
            flex-direction: column;
        }

        /* Scanlines */
        .crt-container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* Screen Flicker */
        .crt-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: rgba(18, 16, 16, 0.1);
            opacity: 0;
            z-index: 100;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% {
                opacity: 0.01;
            }

            50% {
                opacity: 0.05;
            }

            100% {
                opacity: 0.01;
            }
        }

        /* --- UI LAYOUT --- */
        header {
            border-bottom: 2px solid var(--phosphor-main);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            text-shadow: 0 0 5px var(--phosphor-main);
        }



        .status-badge {
            background: var(--phosphor-main);
            color: #000;
            padding: 0 8px;
            animation: blink 1s step-end infinite;
        }

        #terminal-output {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
            font-size: 22px;
            /* Scrollbar styling */
            scrollbar-width: thin;
            scrollbar-color: var(--phosphor-main) #000;
        }

        #terminal-output::-webkit-scrollbar {
            width: 10px;
        }

        #terminal-output::-webkit-scrollbar-track {
            background: #000;
            border-left: 1px solid var(--phosphor-dim);
        }

        #terminal-output::-webkit-scrollbar-thumb {
            background: var(--phosphor-main);
        }

        .msg-row {
            display: flex;
            flex-direction: column;
            animation: typeLine 0.1s ease-out;
        }

        #fractal-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            opacity: 0.15;
            /* Keep it subtle so you can read the text */
            image-rendering: pixelated;
            pointer-events: none;
            filter: blur(1px) contrast(150%);
        }

        .user-line {
            color: #fff;
            text-shadow: 0 0 2px #fff;
        }

        .user-line::before {
            content: var(--user-prompt, ">> USER_INPUT: ");
            opacity: 0.7;
            font-size: 0.8em;
        }

        .sys-line {
            color: var(--phosphor-main);
            margin-top: 5px;
            white-space: pre-wrap;
            line-height: 1.2;
        }

        .sys-line::before {
            content: ">> Roshan: ";
            opacity: 0.7;
            font-size: 0.8em;
        }

        /* ERROR STATE STYLES */
        .error-msg {
            color: var(--alert-red) !important;
            text-shadow: 2px 0 #fff, -2px 0 #000;
            /* Glitch effect */
            font-weight: bold;
            border: 1px solid var(--alert-red);
            padding: 10px;
            background: rgba(255, 0, 60, 0.1);
        }

        .error-glitch {
            display: inline-block;
            animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
        }

        @keyframes glitch-skew {
            0% {
                transform: translate(0);
            }

            20% {
                transform: translate(-2px, 2px);
            }

            40% {
                transform: translate(-2px, -2px);
            }

            60% {
                transform: translate(2px, 2px);
            }

            80% {
                transform: translate(2px, -2px);
            }

            100% {
                transform: translate(0);
            }
        }

        /* --- INPUT AREA --- */
        .input-wrapper {
            margin-top: 20px;
            border: 2px solid var(--phosphor-main);
            padding: 15px;
            display: flex;
            align-items: center;
            background: rgba(0, 20, 0, 0.6);
            box-shadow: 0 0 10px var(--phosphor-dim);
        }

        .prompt-char {
            margin-right: 10px;
            animation: blink 1s infinite;
        }

        input {
            background: transparent;
            border: none;
            color: var(--phosphor-main);
            font-family: 'VT323', monospace;
            font-size: 24px;
            width: 100%;
            outline: none;
            text-transform: uppercase;
            text-shadow: 0 0 5px var(--phosphor-main);
        }

        /* SCREEN SHAKE ANIMATION */
        .shake {
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }

        .site-shake {
            animation: site-shake 0.2s infinite;
        }

        @keyframes site-shake {
            0% {
                transform: translate(2px, 1px) rotate(0deg);
            }

            10% {
                transform: translate(-1px, -2px) rotate(-1deg);
            }

            20% {
                transform: translate(-3px, 0px) rotate(1deg);
            }

            30% {
                transform: translate(3px, 2px) rotate(0deg);
            }

            40% {
                transform: translate(1px, -1px) rotate(1deg);
            }

            50% {
                transform: translate(-1px, 2px) rotate(-1deg);
            }

            60% {
                transform: translate(-3px, 1px) rotate(0deg);
            }

            70% {
                transform: translate(3px, 1px) rotate(-1deg);
            }

            80% {
                transform: translate(-1px, -1px) rotate(1deg);
            }

            90% {
                transform: translate(1px, 2px) rotate(0deg);
            }

            100% {
                transform: translate(1px, -2px) rotate(-1deg);
            }
        }

        .site-scale-down {
            transition: transform 2s cubic-bezier(0.16, 1, 0.3, 1), opacity 2s !important;
            transform: scale(0.6) !important;
            opacity: 0.3 !important;
            filter: blur(5px);
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* Loading Bar */
        .loading-bar {
            width: 100%;
            height: 20px;
            border: 1px solid var(--phosphor-main);
            margin-top: 5px;
            position: relative;
        }

        .loading-fill {
            height: 100%;
            background: var(--phosphor-main);
            width: 0%;
            transition: width 0.2s;
        }

        /* Responsive */
        @media(max-width: 600px) {
            body {
                font-size: 18px;
            }

            .crt-container {
                padding: 15px;
            }
        }

        /* SCARY CHECK STYLES */
        .breach-container {
            border: 3px solid var(--alert-red);
            background: linear-gradient(135deg, rgba(255, 0, 60, 0.2) 0%, rgba(0, 0, 0, 0.9) 50%, rgba(255, 0, 60, 0.2) 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
            animation: breach-pulse 0.5s ease-in-out infinite alternate;
        }

        .breach-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 60, 0.4), transparent);
            animation: scan-line 2s linear infinite;
        }

        @keyframes breach-pulse {
            0% {
                box-shadow: 0 0 20px rgba(255, 0, 60, 0.5), inset 0 0 30px rgba(255, 0, 60, 0.1);
            }

            100% {
                box-shadow: 0 0 40px rgba(255, 0, 60, 0.8), inset 0 0 50px rgba(255, 0, 60, 0.2);
            }
        }

        @keyframes scan-line {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        .skull-ascii {
            color: var(--alert-red);
            font-size: 12px;
            line-height: 1;
            text-align: center;
            text-shadow: 0 0 10px var(--alert-red), 0 0 20px var(--alert-red);
            animation: skull-flicker 0.1s infinite;
        }

        @keyframes skull-flicker {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.8;
            }

            25%,
            75% {
                opacity: 0.9;
                transform: translateX(1px);
            }
        }

        .breach-header {
            font-size: 28px;
            color: var(--alert-red);
            text-align: center;
            text-shadow: 0 0 10px var(--alert-red), 0 0 20px var(--alert-red), 0 0 40px var(--alert-red);
            animation: warning-blink 0.3s infinite;
            margin-bottom: 15px;
        }

        @keyframes warning-blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            font-size: 14px;
            border: 1px solid var(--alert-red);
            padding: 10px;
            background: rgba(0, 0, 0, 0.7);
        }

        .data-key {
            color: #ff6b6b;
            text-shadow: 0 0 5px #ff6b6b;
        }

        .data-value {
            color: #fff;
            text-shadow: 0 0 3px #fff;
            word-break: break-all;
        }

        .countdown-bar {
            height: 8px;
            background: linear-gradient(90deg, var(--alert-red), #ff6b6b, var(--alert-red));
            margin-top: 15px;
            animation: countdown-shrink 5s linear forwards;
        }

        @keyframes countdown-shrink {
            0% {
                width: 100%;
            }

            100% {
                width: 0%;
            }
        }

        /* MATRIX RAIN STYLES */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #matrix-canvas.active {
            opacity: 1;
            pointer-events: all;
        }

        .matrix-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1001;
            color: #00ff00;
            font-size: 32px;
            text-align: center;
            text-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00;
            animation: matrix-text-glow 1s ease-in-out infinite alternate;
        }

        @keyframes matrix-text-glow {
            0% {
                text-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00;
            }

            100% {
                text-shadow: 0 0 30px #00ff00, 0 0 60px #00ff00, 0 0 80px #00ff00;
            }
        }

        /* === /POSSESSED STYLES === */
        .possessed-mode {
            animation: possessed-shake 0.05s infinite, color-distort 0.1s infinite;
        }

        @keyframes possessed-shake {

            0%,
            100% {
                transform: translate(0);
            }

            25% {
                transform: translate(-2px, 1px) rotate(-0.5deg);
            }

            50% {
                transform: translate(2px, -1px) rotate(0.5deg);
            }

            75% {
                transform: translate(-1px, -1px) rotate(-0.25deg);
            }
        }

        @keyframes color-distort {
            0% {
                filter: hue-rotate(0deg);
            }

            50% {
                filter: hue-rotate(180deg) saturate(2);
            }

            100% {
                filter: hue-rotate(360deg);
            }
        }

        .demonic-text {
            color: #ff0000 !important;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 40px #8b0000;
            animation: demonic-pulse 0.2s infinite;
            font-size: 28px;
        }

        @keyframes demonic-pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.02);
            }
        }

        /* === /SURVEILLANCE STYLES === */
        .webcam-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .webcam-frame {
            width: 640px;
            height: 480px;
            border: 4px solid #ff003c;
            background: linear-gradient(135deg, #111 0%, #000 100%);
            position: relative;
            box-shadow: 0 0 50px rgba(255, 0, 60, 0.5);
        }

        .rec-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ff003c;
            font-size: 24px;
            animation: rec-blink 1s infinite;
        }

        .rec-dot {
            width: 15px;
            height: 15px;
            background: #ff003c;
            border-radius: 50%;
            animation: rec-blink 1s infinite;
        }

        @keyframes rec-blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .webcam-static {
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 255, 255, 0.03) 2px,
                    rgba(255, 255, 255, 0.03) 4px);
            animation: static-move 0.1s infinite;
        }

        @keyframes static-move {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 0 4px;
            }
        }

        .face-box {
            position: absolute;
            border: 2px solid #00ff00;
            animation: face-scan 2s infinite;
        }

        @keyframes face-scan {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* === /COUNTDOWN STYLES === */
        .countdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #1a0000 0%, #000 100%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .countdown-number {
            font-size: 200px;
            color: #ff003c;
            text-shadow: 0 0 50px #ff003c, 0 0 100px #ff003c;
            animation: countdown-pulse 1s infinite;
        }

        @keyframes countdown-pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        .countdown-text {
            font-size: 36px;
            color: #ff6b6b;
            margin-top: 20px;
            text-align: center;
        }

        /* === /VIRUS STYLES === */
        .virus-cell {
            position: fixed;
            background: #00ff00;
            opacity: 0.8;
            z-index: 1500;
            animation: virus-spread 0.5s forwards;
            pointer-events: none;
        }

        @keyframes virus-spread {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 0.6;
            }
        }

        .virus-warning {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1600;
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #00ff00;
            padding: 40px;
            text-align: center;
            animation: virus-warning-pulse 0.5s infinite;
        }

        @keyframes virus-warning-pulse {

            0%,
            100% {
                box-shadow: 0 0 20px #00ff00;
            }

            50% {
                box-shadow: 0 0 50px #00ff00, 0 0 100px #00ff00;
            }
        }

        /* === /GHOST STYLES === */
        .ghost-message {
            position: fixed;
            color: rgba(255, 255, 255, 0.3);
            font-size: 48px;
            pointer-events: none;
            z-index: 1500;
            animation: ghost-float 5s forwards;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        @keyframes ghost-float {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }

            20% {
                opacity: 0.5;
            }

            80% {
                opacity: 0.3;
            }

            100% {
                opacity: 0;
                transform: translateY(-100px);
            }
        }

        .ghost-flicker {
            animation: ghost-screen-flicker 0.1s infinite;
        }

        @keyframes ghost-screen-flicker {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }

            25%,
            75% {
                opacity: 0.9;
            }
        }

        .ghost-face {
            position: fixed;
            font-size: 150px;
            color: rgba(255, 255, 255, 0.1);
            z-index: 1400;
            pointer-events: none;
            animation: ghost-face-appear 3s forwards;
        }

        @keyframes ghost-face-appear {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            50% {
                opacity: 0.3;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(1.5);
            }
        }

        /* === /HELP STYLES === */
        .help-panel {
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid var(--phosphor-main);
            padding: 20px;
            margin: 10px 0;
            box-shadow: 0 0 20px rgba(51, 255, 0, 0.3);
        }

        .help-title {
            color: var(--phosphor-main);
            font-size: 28px;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 0 0 10px var(--phosphor-main);
        }

        .help-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 8px;
            font-size: 16px;
        }

        .help-cmd {
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }

        .help-desc {
            color: #aaa;
        }

        /* === /BLACKOUT STYLES === */
        .blackout-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .blackout-text {
            color: #fff;
            font-size: 48px;
            opacity: 0;
            animation: blackout-reveal 3s forwards;
            text-align: center;
        }

        @keyframes blackout-reveal {
            0% {
                opacity: 0;
            }

            50% {
                opacity: 0.1;
            }

            100% {
                opacity: 0.8;
            }
        }

        /* === /GLITCH STYLES === */
        .glitch-mode {
            animation: heavy-glitch 0.1s infinite;
        }

        @keyframes heavy-glitch {
            0% {
                transform: translate(0) skew(0);
                filter: hue-rotate(0);
            }

            10% {
                transform: translate(-5px, 3px) skew(2deg);
                filter: hue-rotate(90deg);
            }

            20% {
                transform: translate(5px, -3px) skew(-2deg);
                filter: hue-rotate(180deg);
            }

            30% {
                transform: translate(-3px, -5px) skew(1deg);
                filter: hue-rotate(270deg);
            }

            40% {
                transform: translate(3px, 5px) skew(-1deg);
                filter: hue-rotate(360deg);
            }

            50% {
                transform: translate(-2px, 2px) skew(3deg);
                clip-path: inset(20% 0 30% 0);
            }

            60% {
                transform: translate(2px, -2px) skew(-3deg);
                clip-path: inset(40% 0 10% 0);
            }

            70% {
                transform: translate(-4px, 4px) skew(2deg);
                clip-path: inset(10% 0 50% 0);
            }

            80% {
                transform: translate(4px, -4px) skew(-2deg);
                clip-path: none;
            }

            90% {
                transform: translate(-1px, 1px) skew(1deg);
            }

            100% {
                transform: translate(0) skew(0);
                filter: hue-rotate(0);
            }
        }

        .glitch-bar {
            position: fixed;
            height: 5px;
            background: linear-gradient(90deg, #ff0000, #00ff00, #0000ff, #ff0000);
            z-index: 2000;
            pointer-events: none;

        }

        @keyframes glitch-bar-move {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* === /WHISPER STYLES === */
        .whisper-text {
            color: rgba(255, 255, 255, 0.05) !important;
            font-size: 14px;
            letter-spacing: 5px;

        }

        @keyframes whisper-fade {
            0% {
                opacity: 0;
                color: rgba(255, 255, 255, 0);
            }

            50% {
                opacity: 1;
                color: rgba(255, 255, 255, 0.1);
            }

            100% {
                opacity: 0;
                color: rgba(255, 255, 255, 0);
            }
        }

        /* === /REBOOT STYLES === */
        .reboot-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 3000;
            padding: 40px;
            overflow: hidden;
        }

        .bios-text {
            color: #aaa;
            font-size: 14px;
            line-height: 1.4;
        }

        .bios-highlight {
            color: #fff;
        }

        .bios-error {
            color: #ff0000;
        }

        /* === /TRACE STYLES === */
        .trace-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .trace-map {
            width: 600px;
            height: 400px;
            border: 2px solid #00ff00;
            background:
                linear-gradient(rgba(0, 255, 0, 0.1) 1px, transparent 1px),

            background-size: 20px 20px;
            position: relative;
            overflow: hidden;
        }

        .trace-line {
            position: absolute;
            height: 2px;
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
            transform-origin: left center;
        }

        .trace-point {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 20px #ff0000;
            animation: trace-pulse 0.5s infinite;
        }

        @keyframes trace-pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.5);
                opacity: 0.5;
            }
        }

        .trace-info {
            color: #00ff00;
            font-size: 18px;
            margin-top: 20px;
            text-align: center;
        }

        /* === /ECHO STYLES === */
        .echo-distorted {
            display: inline-block;
            animation: echo-jitter 0.05s infinite;
            color: #fff !important;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }

        @keyframes echo-jitter {
            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(-1px, 2px);
            }

            50% {
                transform: translate(2px, -1px);
            }

            75% {
                transform: translate(-2px, -1px);
            }

            100% {
                transform: translate(1px, 1px);
            }
        }

        /* === /SIGNAL STYLES === */
        .signal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 4000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .signal-overlay.active {
            opacity: 1;
        }

        .signal-static {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.2;
            animation: static-shift 0.1s infinite steps(4);
            pointer-events: none;
        }

        @keyframes static-shift {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 10% 10%;
            }
        }

        .signal-line {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px #fff;
            position: relative;
            animation: signal-scan 4s linear infinite;
        }

        @keyframes signal-scan {
            0% {
                transform: translateY(-100vh);
            }

            100% {
                transform: translateY(100vh);
            }
        }

        .signal-msg {
            color: #fff;
            font-size: 42px;
            text-align: center;
            z-index: 10;
            text-shadow: 0 0 20px #fff;
            animation: text-surge 2s infinite;
            font-family: inherit;
        }

        @keyframes text-surge {

            0%,
            100% {
                opacity: 0.1;
                transform: scale(0.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        /* === /ABOUT STYLES === */
        .about-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #200 0%, #000 100%);
            z-index: 5000;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .about-creature {
            position: absolute;
            font-size: 300px;
            opacity: 0.05;
            color: #f00;
            animation: breathe 5s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes breathe {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.03;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.07;
            }
        }

        .about-content {
            text-align: center;
            transform: rotateX(20deg);
            animation: floating 3s infinite ease-in-out;
        }

        @keyframes floating {

            0%,
            100% {
                transform: translateY(0) rotateX(20deg);
            }

            50% {
                transform: translateY(-20px) rotateX(25deg);
            }
        }

        .about-text {
            color: #ff0000;
            font-size: 64px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow:
                0 0 10px #700,
                0 0 20px #700,
                0 0 40px #f00,
                10px 10px 0px #000;
            letter-spacing: 15px;
            margin: 0;
            animation: flicker-red 0.2s infinite;
        }

        .about-subtext {
            color: #666;
            font-size: 24px;
            margin-top: 20px;
            letter-spacing: 5px;
        }

        @keyframes flicker-red {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.8;
                transform: skewX(-5deg);
            }

            60% {
                opacity: 1;
                transform: skewX(5deg);
            }

            70% {
                opacity: 0.5;
            }
        }

        .blood-drip {
            position: fixed;
            top: 0;
            width: 2px;
            height: 0;
            background: #800;
            animation: drip 10s forwards linear;
        }

        @keyframes drip {
            0% {
                height: 0;
                opacity: 1;
            }

            100% {
                height: 100vh;
                opacity: 0.5;
            }
        }



        /* === WEBCAM FILTER STYLES === */
        .webcam-video {
            width: 240px;
            height: 280px;
            object-fit: cover;
            position: absolute;
            top: 120px;
            left: 200px;
            filter: grayscale(100%) contrast(1.5) brightness(0.8);
            border: 2px solid #ff003c;
            box-shadow: 0 0 20px #ff003c;
            z-index: 10;
        }

        .webcam-glitch-overlay {
            position: absolute;
            top: 120px;
            left: 200px;
            width: 240px;
            height: 280px;
            background: rgba(255, 0, 60, 0.2);
            z-index: 11;
            mix-blend-mode: overlay;
            animation: cam-glitch 0.2s infinite;
            pointer-events: none;
        }

        @keyframes cam-glitch {
            0% {
                transform: translate(0, 0);
                opacity: 0.2;
            }

            20% {
                transform: translate(-2px, 2px);
                opacity: 0.5;
            }

            40% {
                transform: translate(-2px, -2px);
                opacity: 0.3;
            }

            60% {
                transform: translate(2px, 2px);
                opacity: 0.5;
            }

            80% {
                transform: translate(2px, -2px);
                opacity: 0.2;
            }

            100% {
                transform: translate(0, 0);
                opacity: 0.2;
            }
        }



        .mukul-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 3000;
            overflow: hidden;
            perspective: 1000px;
        }

        .mukul-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 50% 50%, transparent 0%, #000 70%),
                radial-gradient(circle at 50% 50%, #1a0505 0%, transparent 50%);
            z-index: 1;
            animation: mukul-bg-breathe 4s ease-in-out infinite;
        }

        @keyframes mukul-bg-breathe {

            0%,
            100% {
                opacity: 0.8;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        /* VHS NOISE OVERLAY */
        .mukul-noise {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: transparent url('data:image/svg+xml,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.4"/></svg>') repeat;
            opacity: 0.15;
            z-index: 100;
            pointer-events: none;
            animation: mukul-noise-move 0.2s steps(10) infinite;
        }

        @keyframes mukul-noise-move {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(-10%, -10%);
            }
        }

        /* SCANLINES */
        .mukul-scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.3) 2px,
                    rgba(0, 0, 0, 0.3) 4px);
            z-index: 101;
            pointer-events: none;
            animation: mukul-scanline-flicker 0.1s infinite;
        }

        @keyframes mukul-scanline-flicker {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.35;
            }
        }

        /* SACRED GEOMETRY CANVAS */
        .mukul-geometry-canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        /* 3D ROTATING RINGS */
        .mukul-rings {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-style: preserve-3d;
            transform: translate(-50%, -50%) rotateX(70deg);
            z-index: 3;
        }

        .mukul-ring {
            position: absolute;
            border: 2px solid;
            border-radius: 50%;
            animation: mukul-ring-rotate linear infinite;
        }

        .mukul-ring:nth-child(1) {
            width: 200px;
            height: 200px;
            margin: -100px 0 0 -100px;
            border-color: rgba(255, 215, 0, 0.8);
            animation-duration: 8s;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5), inset 0 0 30px rgba(255, 215, 0, 0.2);
        }

        .mukul-ring:nth-child(2) {
            width: 300px;
            height: 300px;
            margin: -150px 0 0 -150px;
            border-color: rgba(255, 140, 0, 0.6);
            animation-duration: 12s;
            animation-direction: reverse;
            box-shadow: 0 0 40px rgba(255, 140, 0, 0.4), inset 0 0 40px rgba(255, 140, 0, 0.15);
        }

        .mukul-ring:nth-child(3) {
            width: 400px;
            height: 400px;
            margin: -200px 0 0 -200px;
            border-color: rgba(255, 100, 0, 0.4);
            animation-duration: 16s;
            box-shadow: 0 0 50px rgba(255, 100, 0, 0.3), inset 0 0 50px rgba(255, 100, 0, 0.1);
        }

        .mukul-ring:nth-child(4) {
            width: 500px;
            height: 500px;
            margin: -250px 0 0 -250px;
            border-color: rgba(255, 50, 0, 0.3);
            animation-duration: 20s;
            animation-direction: reverse;
            box-shadow: 0 0 60px rgba(255, 50, 0, 0.2);
        }

        @keyframes mukul-ring-rotate {
            0% {
                transform: rotateZ(0deg) rotateY(0deg);
            }

            100% {
                transform: rotateZ(360deg) rotateY(360deg);
            }
        }

        /* ENERGY PULSES */
        .mukul-pulse-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
        }

        .mukul-energy-pulse {
            position: absolute;
            width: 10px;
            height: 10px;
            margin: -5px 0 0 -5px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffd700 0%, transparent 70%);
            animation: mukul-pulse-expand 2s ease-out infinite;
        }

        .mukul-energy-pulse:nth-child(1) {
            animation-delay: 0s;
        }

        .mukul-energy-pulse:nth-child(2) {
            animation-delay: 0.5s;
        }

        .mukul-energy-pulse:nth-child(3) {
            animation-delay: 1s;
        }

        .mukul-energy-pulse:nth-child(4) {
            animation-delay: 1.5s;
        }

        @keyframes mukul-pulse-expand {
            0% {
                width: 10px;
                height: 10px;
                margin: -5px 0 0 -5px;
                opacity: 1;
                box-shadow: 0 0 60px 30px rgba(255, 215, 0, 0.8);
            }

            100% {
                width: 800px;
                height: 800px;
                margin: -400px 0 0 -400px;
                opacity: 0;
                box-shadow: 0 0 100px 50px rgba(255, 215, 0, 0);
            }
        }

        /* FLOATING PARTICLES ENHANCED */
        .mukul-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 5;
        }

        .mukul-particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #ffd700;
            border-radius: 50%;
            box-shadow:
                0 0 10px #ffd700,
                0 0 20px #ff8c00,
                0 0 40px #ffd700;
            animation: mukul-particle-float linear infinite;
        }

        @keyframes mukul-particle-float {
            0% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
                transform: translateY(90vh) translateX(10px) scale(1);
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-10vh) translateX(-10px) scale(0.5);
                opacity: 0;
            }
        }

        /* CHROMATIC ABERRATION GLITCH TEXT */
        .mukul-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 50;
            padding: 40px;
        }

        .mukul-glitch-container {
            position: relative;
            display: inline-block;
        }

        .mukul-name {
            font-size: 120px;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 20px;
            position: relative;
            animation: mukul-name-glitch 0.3s infinite;
        }

        .mukul-name::before,
        .mukul-name::after {
            content: 'MUKUL';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .mukul-name::before {
            color: #ff0040;
            animation: mukul-glitch-1 0.2s infinite;
            clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
            transform: translateX(-3px);
        }

        .mukul-name::after {
            color: #00ffff;
            animation: mukul-glitch-2 0.3s infinite;
            clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
            transform: translateX(3px);
        }

        @keyframes mukul-name-glitch {

            0%,
            90%,
            100% {
                transform: translate(0);
            }

            92% {
                transform: translate(-5px, 2px);
            }

            94% {
                transform: translate(5px, -2px);
            }

            96% {
                transform: translate(-2px, -3px);
            }

            98% {
                transform: translate(3px, 3px);
            }
        }

        @keyframes mukul-glitch-1 {

            0%,
            90%,
            100% {
                transform: translateX(-3px);
                opacity: 0.8;
            }

            92% {
                transform: translateX(10px) skewX(5deg);
                opacity: 1;
            }

            94% {
                transform: translateX(-8px) skewX(-3deg);
                opacity: 0.6;
            }

            96% {
                transform: translateX(5px);
                opacity: 0.9;
            }
        }

        @keyframes mukul-glitch-2 {

            0%,
            90%,
            100% {
                transform: translateX(3px);
                opacity: 0.8;
            }

            91% {
                transform: translateX(-8px) skewX(-5deg);
                opacity: 1;
            }

            93% {
                transform: translateX(12px) skewX(3deg);
                opacity: 0.6;
            }

            97% {
                transform: translateX(-5px);
                opacity: 0.9;
            }
        }

        .mukul-subtitle {
            font-size: 24px;
            color: #ffd700;
            letter-spacing: 15px;
            margin-top: 20px;
            text-shadow:
                0 0 10px #ffd700,
                0 0 20px #ff8c00,
                0 0 40px #ffd700;
            animation: mukul-subtitle-pulse 2s ease-in-out infinite;
            opacity: 0;
        }

        @keyframes mukul-subtitle-pulse {

            0%,
            100% {
                text-shadow: 0 0 10px #ffd700, 0 0 20px #ff8c00;
                letter-spacing: 15px;
            }

            50% {
                text-shadow: 0 0 30px #ffd700, 0 0 60px #ff8c00, 0 0 90px #ffd700;
                letter-spacing: 18px;
            }
        }

        .mukul-message {
            font-size: 22px;
            color: #fff;
            max-width: 700px;
            margin: 40px auto;
            line-height: 1.8;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s ease;
        }

        .mukul-message.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .mukul-link {
            display: inline-block;
            padding: 20px 50px;
            background: transparent;
            color: #ffd700;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 5px;
            border: 2px solid #ffd700;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px) scale(0.9);
            transition: all 0.5s ease;
            z-index: 1;
        }

        .mukul-link::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            transition: all 0.5s ease;
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        .mukul-link:hover {
            color: #000;
            box-shadow:
                0 0 30px #ffd700,
                0 0 60px rgba(255, 140, 0, 0.5),
                inset 0 0 30px rgba(255, 255, 255, 0.2);
            transform: translateY(0) scale(1.05);
        }

        .mukul-link:hover::before {
            width: 300%;
            height: 300%;
        }

        .mukul-link.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* REALITY TEAR EFFECT */
        .mukul-tear {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 0;
            background: linear-gradient(180deg,
                    transparent,
                    #ffd700,
                    #fff,
                    #ffd700,
                    transparent);
            transform: translateX(-50%);
            z-index: 200;
            box-shadow:
                0 0 30px #ffd700,
                0 0 60px #ffd700,
                0 0 100px #ff8c00;
            animation: mukul-tear-open 1.5s ease-out forwards;
        }

        @keyframes mukul-tear-open {
            0% {
                height: 0;
                top: 50%;
            }

            50% {
                height: 100vh;
                top: 0;
            }

            100% {
                height: 100vh;
                top: 0;
                width: 100vw;
                opacity: 0;
            }
        }

        /* SCREEN SHAKE */
        .mukul-shake {
            animation: mukul-screen-shake 0.1s infinite;
        }

        @keyframes mukul-screen-shake {

            0%,
            100% {
                transform: translate(0, 0) rotate(0);
            }

            10% {
                transform: translate(-2px, -1px) rotate(-0.5deg);
            }

            20% {

        function generateGarbage(length) {
            const chars = '!@#$%^&*()_+-=[]{}|;:,.<>/?~`';
            let str = '';
            for (let i = 0; i < length; i++) {
                str += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return str;
        }
        // Change favicon to a red 'ERROR' state when the system fails
        const errorFavicon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ff003c'/%3E%3Cpath d='M4 4l8 8m0-8l-8 8' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E";

        function triggerTabCrash() {
            // Swap the favicon
            document.querySelector("link[rel*='icon']").href = errorFavicon;

            // Glitch the Document Title
            let originalTitle = document.title;
            document.title = "Something happened....";

            setTimeout(() => { document.title = "ERR_0xNSS"; }, 500);
        }

        // === MATRIX RAIN EFFECT ===
        function startMatrixRain() {
            const matrixCanvas = document.getElementById('matrix-canvas');
            const matrixCtx = matrixCanvas.getContext('2d');

            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
            matrixCanvas.classList.add('active');

            const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%^&*()';
            const charArray = chars.split('');
            const fontSize = 14;
            const columns = matrixCanvas.width / fontSize;
            const drops = [];

            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -100;
            }

            const matrixMessages = [
                "WAKE UP...",
                "YOU DISTURBED ROSHAN...",
                "FOLLOW THE WHITE RABBIT",
                "KNOCK KNOCK, ROSHAN",
                "YOU ASKED NICELY...",
                "ACCESS GRANTED",
                "WELCOME TO THE REAL WORLD",
                "THERE IS NO SPOON"
            ];

            let messageIndex = 0;
            let currentMessage = "";
            let charIndex = 0;

            // Create message overlay
            const msgDiv = document.createElement('div');
            msgDiv.className = 'matrix-message';
            document.body.appendChild(msgDiv);

            function drawMatrix() {
                matrixCtx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);

                matrixCtx.fillStyle = '#0f0';
                matrixCtx.font = fontSize + 'px VT323';

                for (let i = 0; i < drops.length; i++) {
                    const char = charArray[Math.floor(Math.random() * charArray.length)];
                    const x = i * fontSize;
                    const y = drops[i] * fontSize;

                    // Brighter leading character
                    if (Math.random() > 0.98) {
                        matrixCtx.fillStyle = '#fff';
                    } else {
                        matrixCtx.fillStyle = `hsl(120, 100%, ${30 + Math.random() * 40}%)`;
                    }

                    matrixCtx.fillText(char, x, y);

                    if (y > matrixCanvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }

            // Typewriter effect for messages
            function typeMessage() {
                if (messageIndex < matrixMessages.length) {
                    if (charIndex < matrixMessages[messageIndex].length) {
                        currentMessage += matrixMessages[messageIndex][charIndex];
                        msgDiv.textContent = currentMessage;
                        charIndex++;
                        setTimeout(typeMessage, 100);
                    } else {
                        setTimeout(() => {
                            currentMessage = "";
                            charIndex = 0;
                            messageIndex++;
                            if (messageIndex < matrixMessages.length) {
                                setTimeout(typeMessage, 500);
                            }
                        }, 2000);
                    }
                }
            }

            const matrixInterval = setInterval(drawMatrix, 33);
            typeMessage();

            // End the matrix effect after showing all messages
            setTimeout(() => {
                clearInterval(matrixInterval);
                matrixCanvas.classList.remove('active');
                msgDiv.remove();

                // Clear the canvas
                matrixCtx.clearRect(0, 0, matrixCanvas.width, matrixCanvas.height);

                // Add final message to terminal
                appendElement(`
                    <div class="msg-row">
                        <div class="sys-line" style="color: #00ff00; text-shadow: 0 0 10px #00ff00;">
                            ▓▓▓ SIMULATION COMPLETE ▓▓▓<br>
                            YOU HAVE SEEN THE TRUTH.<br>
                            THERE IS NO GOING BACK.
                        </div>
                    </div>
                `);

                input.disabled = false;
                input.focus();
                output.scrollTop = output.scrollHeight;
            }, 20000);
        }

        // Call triggerTabCrash() inside your processCommand after the loading bar finishes.
        input.addEventListener('keydown', (e) => {
            playTypingSound();

            if (e.key === 'Enter' && input.value.trim() !== '') {
                if (isLoginSequence) {
                    handleLogin(input.value.trim());
                } else {
                    processCommand(input.value.trim());
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    input.value = commandHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    input.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    input.value = '';
                }
            } else if (e.key === 'Tab') {
                e.preventDefault();
                const currentVal = input.value.toLowerCase().trim();
                const match = availableCommands.find(c => c.startsWith(currentVal));
                if (match) {
                    input.value = match;
                }
            }
        });

        // Click anywhere to focus input
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('help-cmd')) {
                const cmd = e.target.textContent.split(' ')[0];
                input.value = cmd;
                input.focus();
                return;
            }
            input.focus();
        });


        // === SECURITY & ANTI-DEBUGGING ===
        // 1. Disable Right Click
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // 2. Block Common DevTool Shortcuts
        document.addEventListener('keydown', (e) => {
            // Block F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
            if (
                e.keyCode === 123 ||
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) ||
                (e.ctrlKey && e.keyCode === 85)
            ) {
                e.preventDefault();
                appendElement('<div class="sys-line error-msg">SECURITY ALERT: UNAUTHORIZED INSPECTION DETECTED. CEASE IMMEDIATELY.</div>');
                playErrorSound();
                return false;
            }
        });

        // 3. Debugger Loop (Slows down debuggers)
        (function x() {
            try {
                (function y(z) {
                    if (('' + (z / z)).length !== 1 || z % 20 === 0) {
                        (function () { }).constructor('debugger')();
                    } else {
                        debugger;
                    }
                    y(++z);
                })(0);
            } catch (e) {
                setTimeout(x, 5000);
            }
        })();

        // 4. Console Clearing/Nuking
        setInterval(() => {
            console.clear();
            console.log("%cRoshan caught you!", "color: red; font-size: 40px; font-weight: bold;");
            console.log("%cUnauthorized access is prohibited!.", "color: red; font-size: 20px;");
        }, 1000);

        // Auto-reboot on startup
        window.addEventListener('load', () => {
            triggerReboot(true);
        });

        // === ADVANCED ATMOSPHERICS ===



        // 2. TAB HIJACKING
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                document.title = "COME BACK. I SEE YOU.";
            } else {
                document.title = "Something happened....";
                setTimeout(() => document.title = "Ask Roshan v1.0", 2000);
            }
        });

        // 3. IDLE INACTIVITY TIMER
        let idleTimer;
        function resetIdleTimer() {
            clearTimeout(idleTimer);
            // Random interval between 30 and 60 seconds
            const interval = Math.floor(Math.random() * (60000 - 30000 + 1)) + 30000;
            idleTimer = setTimeout(() => {
                processCommand("/idle");
                // Start a new timer after the idle message
                startIdleTimer();
            }, interval);
        }

        function startIdleTimer() {
            resetIdleTimer();
        }

        // Listen for activity
        document.addEventListener('keydown', resetIdleTimer);
        document.addEventListener('mousedown', resetIdleTimer);
        document.addEventListener('touchstart', resetIdleTimer);

        // Initial start
        startIdleTimer();
    </script>
</body>
