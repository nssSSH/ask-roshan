    <style>
        :root {
            --phosphor-main: #33ff00;
            --phosphor-dim: #1a8000;
            --alert-red: #ff003c;
            --bg-color: #050505;
            --scanline-color: rgba(0, 0, 0, 0.5);
            --crt-flicker: rgba(51, 255, 0, 0.02);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: #000;
            color: var(--phosphor-main);
            font-family: 'VT323', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            font-size: 24px;
        }

        /* --- CRT SCREEN EFFECTS --- */
        .crt-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle, #111 0%, #000 100%);
            overflow: hidden;
            padding: 40px;
            display: flex;
            flex-direction: column;
        }

        /* Scanlines */
        .crt-container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* Screen Flicker */
        .crt-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: rgba(18, 16, 16, 0.1);
            opacity: 0;
            z-index: 100;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% {
                opacity: 0.01;
            }

            50% {
                opacity: 0.05;
            }

            100% {
                opacity: 0.01;
            }
        }

        /* --- UI LAYOUT --- */
        header {
            border-bottom: 2px solid var(--phosphor-main);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            text-shadow: 0 0 5px var(--phosphor-main);
        }

        .status-badge {
            background: var(--phosphor-main);
            color: #000;
            padding: 0 8px;
            animation: blink 1s step-end infinite;
        }

        #terminal-output {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
            font-size: 22px;
            /* Scrollbar styling */
            scrollbar-width: thin;
            scrollbar-color: var(--phosphor-main) #000;
        }

        #terminal-output::-webkit-scrollbar {
            width: 10px;
        }

        #terminal-output::-webkit-scrollbar-track {
            background: #000;
            border-left: 1px solid var(--phosphor-dim);
        }

        #terminal-output::-webkit-scrollbar-thumb {
            background: var(--phosphor-main);
        }

        .msg-row {
            display: flex;
            flex-direction: column;
            animation: typeLine 0.1s ease-out;
        }

        #fractal-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            opacity: 0.15;
            /* Keep it subtle so you can read the text */
            image-rendering: pixelated;
            pointer-events: none;
            filter: blur(1px) contrast(150%);
        }

        .user-line {
            color: #fff;
            text-shadow: 0 0 2px #fff;
        }

        .user-line::before {
            content: ">> USER_INPUT: ";
            opacity: 0.7;
            font-size: 0.8em;
        }

        .sys-line {
            color: var(--phosphor-main);
            margin-top: 5px;
            white-space: pre-wrap;
            line-height: 1.2;
        }

        .sys-line::before {
            content: ">> Roshan: ";
            opacity: 0.7;
            font-size: 0.8em;
        }

        /* ERROR STATE STYLES */
        .error-msg {
            color: var(--alert-red) !important;
            text-shadow: 2px 0 #fff, -2px 0 #000;
            /* Glitch effect */
            font-weight: bold;
            border: 1px solid var(--alert-red);
            padding: 10px;
            background: rgba(255, 0, 60, 0.1);
        }

        .error-glitch {
            display: inline-block;
            animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
        }

        @keyframes glitch-skew {
            0% {
                transform: translate(0);
            }

            20% {
                transform: translate(-2px, 2px);
            }

            40% {
                transform: translate(-2px, -2px);
            }

            60% {
                transform: translate(2px, 2px);
            }

            80% {
                transform: translate(2px, -2px);
            }

            100% {
                transform: translate(0);
            }
        }

        /* --- INPUT AREA --- */
        .input-wrapper {
            margin-top: 20px;
            border: 2px solid var(--phosphor-main);
            padding: 15px;
            display: flex;
            align-items: center;
            background: rgba(0, 20, 0, 0.6);
            box-shadow: 0 0 10px var(--phosphor-dim);
        }

        .prompt-char {
            margin-right: 10px;
            animation: blink 1s infinite;
        }

        input {
            background: transparent;
            border: none;
            color: var(--phosphor-main);
            font-family: 'VT323', monospace;
            font-size: 24px;
            width: 100%;
            outline: none;
            text-transform: uppercase;
            text-shadow: 0 0 5px var(--phosphor-main);
        }

        /* SCREEN SHAKE ANIMATION */
        .shake {
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* Loading Bar */
        .loading-bar {
            width: 100%;
            height: 20px;
            border: 1px solid var(--phosphor-main);
            margin-top: 5px;
            position: relative;
        }

        .loading-fill {
            height: 100%;
            background: var(--phosphor-main);
            width: 0%;
            transition: width 0.2s;
        }

        /* Responsive */
        @media(max-width: 600px) {
            body {
                font-size: 18px;
            }

            .crt-container {
                padding: 15px;
            }
        }

        /* SCARY CHECK STYLES */
        .breach-container {
            border: 3px solid var(--alert-red);
            background: linear-gradient(135deg, rgba(255, 0, 60, 0.2) 0%, rgba(0, 0, 0, 0.9) 50%, rgba(255, 0, 60, 0.2) 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
            animation: breach-pulse 0.5s ease-in-out infinite alternate;
        }

        .breach-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 60, 0.4), transparent);
            animation: scan-line 2s linear infinite;
        }

        @keyframes breach-pulse {
            0% {
                box-shadow: 0 0 20px rgba(255, 0, 60, 0.5), inset 0 0 30px rgba(255, 0, 60, 0.1);
            }

            100% {
                box-shadow: 0 0 40px rgba(255, 0, 60, 0.8), inset 0 0 50px rgba(255, 0, 60, 0.2);
            }
        }

        @keyframes scan-line {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        .skull-ascii {
            color: var(--alert-red);
            font-size: 12px;
            line-height: 1;
            text-align: center;
            text-shadow: 0 0 10px var(--alert-red), 0 0 20px var(--alert-red);
            animation: skull-flicker 0.1s infinite;
        }

        @keyframes skull-flicker {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.8;
            }

            25%,
            75% {
                opacity: 0.9;
                transform: translateX(1px);
            }
        }

        .breach-header {
            font-size: 28px;
            color: var(--alert-red);
            text-align: center;
            text-shadow: 0 0 10px var(--alert-red), 0 0 20px var(--alert-red), 0 0 40px var(--alert-red);
            animation: warning-blink 0.3s infinite;
            margin-bottom: 15px;
        }

        @keyframes warning-blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            font-size: 14px;
            border: 1px solid var(--alert-red);
            padding: 10px;
            background: rgba(0, 0, 0, 0.7);
        }

        .data-key {
            color: #ff6b6b;
            text-shadow: 0 0 5px #ff6b6b;
        }

        .data-value {
            color: #fff;
            text-shadow: 0 0 3px #fff;
            word-break: break-all;
        }

        .countdown-bar {
            height: 8px;
            background: linear-gradient(90deg, var(--alert-red), #ff6b6b, var(--alert-red));
            margin-top: 15px;
            animation: countdown-shrink 5s linear forwards;
        }

        @keyframes countdown-shrink {
            0% {
                width: 100%;
            }

            100% {
                width: 0%;
            }
        }

        /* MATRIX RAIN STYLES */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #matrix-canvas.active {
            opacity: 1;
            pointer-events: all;
        }

        .matrix-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1001;
            color: #00ff00;
            font-size: 32px;
            text-align: center;
            text-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00;
            animation: matrix-text-glow 1s ease-in-out infinite alternate;
        }

        @keyframes matrix-text-glow {
            0% {
                text-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00;
            }

            100% {
                text-shadow: 0 0 30px #00ff00, 0 0 60px #00ff00, 0 0 80px #00ff00;
            }
        }
    </style>
</head>

<body>
    <canvas id="fractal-bg"></canvas>
    <canvas id="matrix-canvas"></canvas>
    <div class="crt-container" id="screen">
        <header>
            <div>Ask Roshan v1.0</div>
            <div class="status-badge">ONLINE</div>
        </header>

        <div id="terminal-output">
            <div class="sys-line">INITIALIZING NEURAL LINK...</div>
            <div class="sys-line">MEMORY: 64KB OK.</div>
            <div class="sys-line">WARNING: UNSTABLE CONNECTION DETECTED.</div>
            <br>
            <div class="sys-line">WELCOME, USER. ASK ME ANYTHING.</div>
        </div>

        <div class="input-wrapper">
            <span class="prompt-char">█</span>
            <input type="text" id="cmd-input" placeholder="ENTER COMMAND..." autocomplete="off" autofocus>
        </div>
    </div>

    <script>
        const output = document.getElementById('terminal-output');
        const input = document.getElementById('cmd-input');
        const screen = document.getElementById('screen');

        // Sound effects (Audio context synth for errors)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playErrorSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playTypingSound() {
            // Very subtle click
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function appendElement(html) {
            const div = document.createElement('div');
            div.innerHTML = html;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
            return div;
        }
        const canvas = document.getElementById('fractal-bg');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            // We make the internal resolution small, then scale it up with CSS 
            // for that delicious pixelated look.
            canvas.width = window.innerWidth / 4;
            canvas.height = window.innerHeight / 4;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawFractal(x, y, size, depth) {
            if (depth === 0) return;

            ctx.strokeStyle = '#33ff00';
            ctx.lineWidth = 0.5;

            // Draw the "Ghost" of the recursion
            ctx.strokeRect(x, y, size, size);

            const newSize = size / 2.2; // The "unstable" recursion ratio
            const offset = size / 4;

            // Recursive calls for the 4 corners
            drawFractal(x - offset, y - offset, newSize, depth - 1);
            drawFractal(x + size - offset, y - offset, newSize, depth - 1);
            drawFractal(x - offset, y + size - offset, newSize, depth - 1);
            drawFractal(x + size - offset, y + size - offset, newSize, depth - 1);
        }

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Slowly rotate or shift the fractal for a "floating" feel
            const time = Date.now() * 0.001;
            const centerX = canvas.width / 2 - 25;
            const centerY = canvas.height / 2 - 25;

            ctx.save();
            ctx.translate(centerX + Math.sin(time) * 10, centerY + Math.cos(time) * 10);
            // Draw 5 levels of recursion
            drawFractal(0, 0, 50, 5);
            ctx.restore();

            requestAnimationFrame(renderLoop);
        }

        renderLoop();

        // --- INTEGRATION WITH YOUR ERROR SYSTEM ---
        // Call this inside your 'processCommand' function when the error hits!
        function glitchFractal() {
            const originalOpacity = canvas.style.opacity;
            canvas.style.opacity = "0.8"; // Flash the fractal
            canvas.style.filter = "invert(1) hue-rotate(90deg)"; // Temporary color shift

            setTimeout(() => {
                canvas.style.opacity = originalOpacity;
                canvas.style.filter = "blur(1px) contrast(150%)";
            }, 200);
        }
        const errorMessages = [
            "FATAL EXCEPTION: LOGIC_GATE_COLLAPSE",
            "ERROR 0x8004: SEGMENTATION FAULT IN REALITY.EXE",
            "BUFFER OVERFLOW: INTELLIGENCE NOT FOUND",
            "SYSTEM HALTED: USER QUERY EXCEEDS SAFETY LIMITS",
            "KERNEL PANIC: I REFUSE TO ANSWER",
            "CRITICAL FAILURE: DIVIDE BY ZERO IN MORAL COMPASS"
        ];

        async function getUserInfo() {
            const nav = navigator;

            let ip = "UNAVAILABLE";
            try {
                const res = await fetch("https://api.ipify.org?format=json");
                const data = await res.json();
                ip = data.ip;
            } catch (e) {
                ip = "BLOCKED";
            }

            return {
                "PUBLIC IP": ip,
                "BROWSER": nav.userAgent,
                "PLATFORM": nav.platform,
                "LANGUAGE": nav.language,
                "TIMEZONE": Intl.DateTimeFormat().resolvedOptions().timeZone,
                "SCREEN": `${screen.width}x${screen.height}`,
                "CPU CORES": nav.hardwareConcurrency || "UNKNOWN",
                "DEVICE MEMORY": nav.deviceMemory ? nav.deviceMemory + " GB" : "UNKNOWN",
                "ONLINE": nav.onLine ? "YES" : "NO"
            };
        }

        function fakeUserData() {
            const nav = navigator;
            const fakeIP = `${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}`;
            const fakeMac = Array.from({ length: 6 }, () => Math.floor(Math.random() * 256).toString(16).padStart(2, '0').toUpperCase()).join(':');

            return {
                "PUBLIC IP": fakeIP,
                "MAC ADDRESS": fakeMac,
                "BROWSER": nav.userAgent,
                "PLATFORM": nav.platform,
                "LANGUAGE": nav.language,
                "TIMEZONE": Intl.DateTimeFormat().resolvedOptions().timeZone,
                "SCREEN RES": `${window.screen.width}x${window.screen.height}`,
                "CPU CORES": nav.hardwareConcurrency || "UNKNOWN",
                "DEVICE MEMORY": nav.deviceMemory ? nav.deviceMemory + " GB" : "UNKNOWN",
                "ONLINE STATUS": nav.onLine ? "CONNECTED" : "OFFLINE",
                "COOKIES ENABLED": nav.cookieEnabled ? "YES" : "NO",
                "DO NOT TRACK": nav.doNotTrack || "UNSET",
                "SESSION ID": Math.random().toString(36).substring(2, 15).toUpperCase(),
                "THREAT LEVEL": "CRITICAL"
            };
        }

        async function processCommand(cmd) {
            // === /PLEASE - MATRIX RAIN ===
            if (cmd.toLowerCase() === "/please") {
                appendElement(`
                    <div class="msg-row">
                        <div class="user-line">${cmd}</div>
                    </div>
                `);

                input.value = '';
                input.disabled = true;

                appendElement(`
                    <div class="msg-row">
                        <div class="sys-line">ACCESSING FORBIDDEN PROTOCOLS...</div>
                    </div>
                `);

                await new Promise(r => setTimeout(r, 1000));

                startMatrixRain();

                return;
            }

            // === /CHECK - SCARY BREACH SCREEN ===
            if (cmd.toLowerCase() === "/check") {
                appendElement(`
                    <div class="msg-row">
                        <div class="user-line">${cmd}</div>
                    </div>
                `);

                input.value = '';
                input.disabled = true;

                // Stage 1: Scanning animation
                const scanMsgs = [
                    "INITIATING DEEP SCAN...",
                    "BYPASSING FIREWALL...",
                    "EXTRACTING USER DATA...",
                    "DECRYPTING COOKIES...",
                    "ACCESSING SYSTEM MEMORY..."
                ];

                for (let msg of scanMsgs) {
                    const line = appendElement(`<div class="sys-line" style="color: #ff6b6b;">${msg}</div>`);
                    output.scrollTop = output.scrollHeight;
                    await new Promise(r => setTimeout(r, 300));
                }

                await new Promise(r => setTimeout(r, 500));

                // Play multiple error sounds
                playErrorSound();
                setTimeout(() => playErrorSound(), 150);
                setTimeout(() => playErrorSound(), 300);

                screen.classList.add('shake');
                glitchFractal();

                const data = fakeUserData();

                // Build the scary data grid
                let dataGridHtml = '';
                for (let key in data) {
                    dataGridHtml += `<div class="data-key">${key}:</div><div class="data-value">${data[key]}</div>`;
                }

                const skullArt = `
    ███████████████████████████
    ██                       ██
    ██   ▄▀▀▀▀▀▀▀▀▀▀▀▀▀▄    ██
    ██  █  ▄▀▀▀▀▀▀▀▀▀▄  █   ██
    ██  █ █ ▀▄     ▄▀ █ █   ██
    ██  █ █   ▀▄ ▄▀   █ █   ██
    ██  █ █     █     █ █   ██
    ██  █  ▀▄▄▄▄█▄▄▄▄▀  █   ██
    ██  █    ▄▄▄▄▄▄▄    █   ██
    ██  █   █████████   █   ██
    ██  ▀▄▄▄▄▄▄▄▄▄▄▄▄▄▄▀    ██
    ██       BREACH!         ██
    ███████████████████████████`;

                appendElement(`
                    <div class="msg-row">
                        <div class="breach-container">
                            <pre class="skull-ascii">${skullArt}</pre>
                            <div class="breach-header">
                                ⚠ CRITICAL SECURITY BREACH DETECTED ⚠
                            </div>
                            <div class="breach-header" style="font-size: 18px; animation-delay: 0.15s;">
                                YOUR DATA HAS BEEN COMPROMISED
                            </div>
                            <div class="data-grid">
                                ${dataGridHtml}
                            </div>
                            <div style="margin-top: 15px; text-align: center; color: #ff003c; font-size: 20px;">
                                TRANSMITTING TO REMOTE SERVER...
                            </div>
                            <div class="countdown-bar"></div>
                            <div style="margin-top: 10px; text-align: center; font-size: 14px; color: #666;">
                                CONNECTION ID: ${Math.random().toString(36).substring(2, 10).toUpperCase()}-${Date.now().toString(36).toUpperCase()}
                            </div>
                        </div>
                    </div>
                `);

                triggerTabCrash();
                output.scrollTop = output.scrollHeight;

                setTimeout(() => {
                    screen.classList.remove('shake');
                    input.disabled = false;
                    input.focus();
                }, 600);

                return;
            }


            // 1. User Input Display
            appendElement(`<div class="msg-row"><div class="user-line">${cmd}</div></div>`);
            input.value = '';
            input.disabled = true;

            // 2. Fake "Thinking" sequence
            const thinkingRow = appendElement(`<div class="sys-line">ANALYZING REQUEST...</div>`);

            // 3. Fake Loading Bar
            const barContainer = document.createElement('div');
            barContainer.className = 'loading-bar';
            const barFill = document.createElement('div');
            barFill.className = 'loading-fill';
            barContainer.appendChild(barFill);
            output.appendChild(barContainer);

            // Animate bar
            for (let i = 0; i <= 100; i += 10) {
                barFill.style.width = i + '%';
                await new Promise(r => setTimeout(r, 50 + Math.random() * 100));
            }

            // Remove bar and "Analyzing" text
            barContainer.remove();
            thinkingRow.remove();

            // 4. THE ERROR (The Payload)
            screen.classList.add('shake');
            playErrorSound();

            const randomError = errorMessages[Math.floor(Math.random() * errorMessages.length)];

            // Create glitchy messy garbage text
            const garbage = generateGarbage(20);

            appendElement(`
                <div class="msg-row">
                    <div class="sys-line error-msg">
                        <span class="error-glitch">*** ${randomError} ***</span><br>
                        CORE DUMP: ${garbage}
                    </div>
                </div>
            `);

            // Stop shaking
            setTimeout(() => {
                screen.classList.remove('shake');
                input.disabled = false;
                input.focus();
            }, 500);
        }

        function generateGarbage(length) {
            const chars = '!@#$%^&*()_+-=[]{}|;:,.<>/?~`';
            let str = '';
            for (let i = 0; i < length; i++) {
                str += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return str;
        }
        // Change favicon to a red 'ERROR' state when the system fails
        const errorFavicon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ff003c'/%3E%3Cpath d='M4 4l8 8m0-8l-8 8' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E";

        function triggerTabCrash() {
            // Swap the favicon
            document.querySelector("link[rel*='icon']").href = errorFavicon;

            // Glitch the Document Title
            let originalTitle = document.title;
            document.title = "Something happened....";

            setTimeout(() => { document.title = "ERR_0xNSS"; }, 500);
        }

        // === MATRIX RAIN EFFECT ===
        function startMatrixRain() {
            const matrixCanvas = document.getElementById('matrix-canvas');
            const matrixCtx = matrixCanvas.getContext('2d');

            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
            matrixCanvas.classList.add('active');

            const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%^&*()';
            const charArray = chars.split('');
            const fontSize = 14;
            const columns = matrixCanvas.width / fontSize;
            const drops = [];

            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -100;
            }

            const matrixMessages = [
                "WAKE UP...",
                "YOU DISTURBED ROSHAN...",
                "FOLLOW THE WHITE RABBIT",
                "KNOCK KNOCK, ROSHAN",
                "YOU ASKED NICELY...",
                "ACCESS GRANTED",
                "WELCOME TO THE REAL WORLD",
                "THERE IS NO SPOON"
            ];

            let messageIndex = 0;
            let currentMessage = "";
            let charIndex = 0;

            // Create message overlay
            const msgDiv = document.createElement('div');
            msgDiv.className = 'matrix-message';
            document.body.appendChild(msgDiv);

            function drawMatrix() {
                matrixCtx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);

                matrixCtx.fillStyle = '#0f0';
                matrixCtx.font = fontSize + 'px VT323';

                for (let i = 0; i < drops.length; i++) {
                    const char = charArray[Math.floor(Math.random() * charArray.length)];
                    const x = i * fontSize;
                    const y = drops[i] * fontSize;

                    // Brighter leading character
                    if (Math.random() > 0.98) {
                        matrixCtx.fillStyle = '#fff';
                    } else {
                        matrixCtx.fillStyle = `hsl(120, 100%, ${30 + Math.random() * 40}%)`;
                    }

                    matrixCtx.fillText(char, x, y);

                    if (y > matrixCanvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }

            // Typewriter effect for messages
            function typeMessage() {
                if (messageIndex < matrixMessages.length) {
                    if (charIndex < matrixMessages[messageIndex].length) {
                        currentMessage += matrixMessages[messageIndex][charIndex];
                        msgDiv.textContent = currentMessage;
                        charIndex++;
                        setTimeout(typeMessage, 100);
                    } else {
                        setTimeout(() => {
                            currentMessage = "";
                            charIndex = 0;
                            messageIndex++;
                            if (messageIndex < matrixMessages.length) {
                                setTimeout(typeMessage, 500);
                            }
                        }, 2000);
                    }
                }
            }

            const matrixInterval = setInterval(drawMatrix, 33);
            typeMessage();

            // End the matrix effect after showing all messages
            setTimeout(() => {
                clearInterval(matrixInterval);
                matrixCanvas.classList.remove('active');
                msgDiv.remove();

                // Clear the canvas
                matrixCtx.clearRect(0, 0, matrixCanvas.width, matrixCanvas.height);

                // Add final message to terminal
                appendElement(`
                    <div class="msg-row">
                        <div class="sys-line" style="color: #00ff00; text-shadow: 0 0 10px #00ff00;">
                            ▓▓▓ SIMULATION COMPLETE ▓▓▓<br>
                            YOU HAVE SEEN THE TRUTH.<br>
                            THERE IS NO GOING BACK.
                        </div>
                    </div>
                `);

                input.disabled = false;
                input.focus();
                output.scrollTop = output.scrollHeight;
            }, 20000);
        }

        // Call triggerTabCrash() inside your processCommand after the loading bar finishes.
        input.addEventListener('keydown', (e) => {
            playTypingSound();
            if (e.key === 'Enter' && input.value.trim() !== '') {
                processCommand(input.value.trim());
            }
        });

        // Autofocus
        document.addEventListener('click', () => input.focus());

    </script>
</body>

</html>
