<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Roshan</title>

<style>
:root {
  --bg-main: #ffffff;
  --bg-secondary: #f9f9f9;
  --border-subtle: #e5e5e5;
  --text-main: #171717;
  --text-muted: #676767;
  --accent: #212121;
  --sidebar-width: 260px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background-color: var(--bg-main);
  color: var(--text-main);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: var(--sidebar-width);
  background-color: var(--bg-secondary);
  border-right: 1px solid var(--border-subtle);
  padding: 12px;
}

.new-chat-btn {
  width: 100%;
  border: 1px solid var(--border-subtle);
  background: white;
  padding: 10px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}

/* Main Chat */
.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
}

header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border-subtle);
}

header h1 {
  font-size: 16px;
  font-weight: 600;
}

#chat-log {
  flex: 1;
  overflow-y: auto;
}

/* Empty State */
.empty-state {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px;
}

.empty-state h2 {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 8px;
}

.empty-state p {
  color: var(--text-muted);
  font-size: 14px;
}

/* Messages */
.message-wrapper {
  padding: 24px 20px;
}

.message-content {
  max-width: 768px;
  margin: 0 auto;
  display: flex;
  gap: 16px;
}

.avatar {
  width: 30px;
  height: 30px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 12px;
}

.user-avatar {
  background-color: #5436da;
  color: white;
}

.ai-avatar {
  background-color: #10a37f;
  color: white;
}

.text-container {
  line-height: 1.6;
  font-size: 15px;
}

.ai-row {
  background-color: var(--bg-secondary);
  border-top: 1px solid var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
}

/* Input */
.input-area {
  padding: 24px 20px 40px;
  border-top: 1px solid var(--border-subtle);
}

.input-constrained {
  max-width: 768px;
  margin: 0 auto;
  position: relative;
}

.neutral-notice {
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
  margin-bottom: 12px;
}

.input-box {
  width: 100%;
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 12px 48px 12px 16px;
  font-size: 16px;
  resize: none;
}

.send-button {
  position: absolute;
  right: 12px;
  bottom: 10px;
  background-color: var(--accent);
  color: white;
  border: none;
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
}

.send-button:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

@media (max-width: 768px) {
  .sidebar { display: none; }
}
</style>
</head>

<body>

<aside class="sidebar">
  <button class="new-chat-btn">+ New Chat</button>
</aside>

<div class="chat-container">
  <header>
    <h1>Ask Roshan</h1>
  </header>

  <main id="chat-log">
    <div id="empty-state" class="empty-state">
      <div>
        <h2>Welcome to Ask Roshan</h2>
        <p>The single greatest AI LLM in existence.</p>
      </div>
    </div>
  </main>

  <footer class="input-area">
    <div class="input-constrained">
      <p class="neutral-notice">
        Ask Roshan is an AI assistant designed to provide information and support.
      </p>
      <textarea id="msg-input" class="input-box" rows="1" placeholder="Type your message..."></textarea>
      <button id="submit-btn" class="send-button" disabled>Send</button>
    </div>
  </footer>
</div>

<script>
const chatLog = document.getElementById('chat-log');
const emptyState = document.getElementById('empty-state');
const msgInput = document.getElementById('msg-input');
const submitBtn = document.getElementById('submit-btn');

function appendMessage(text, isUser) {
  if (emptyState) emptyState.remove();

  const wrapper = document.createElement('div');
  wrapper.className = `message-wrapper ${isUser ? '' : 'ai-row'}`;

  const content = document.createElement('div');
  content.className = 'message-content';

  const avatar = document.createElement('div');
  avatar.className = `avatar ${isUser ? 'user-avatar' : 'ai-avatar'}`;
  avatar.textContent = isUser ? 'U' : 'AR';

  const textContainer = document.createElement('div');
  textContainer.className = 'text-container';
  textContainer.textContent = text;

  content.appendChild(avatar);
  content.appendChild(textContainer);
  wrapper.appendChild(content);
  chatLog.appendChild(wrapper);

  chatLog.scrollTop = chatLog.scrollHeight;
}

function handleSubmission() {
  const query = msgInput.value.trim();
  if (!query) return;

  appendMessage(query, true);
  msgInput.value = '';
  submitBtn.disabled = true;

  setTimeout(() => {
    appendMessage("There was a error getting response. Try again later", false);
  }, 400);
}

msgInput.addEventListener('input', () => {
  submitBtn.disabled = msgInput.value.trim().length === 0;
  msgInput.style.height = 'auto';
  msgInput.style.height = msgInput.scrollHeight + 'px';
});

msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSubmission();
  }
});

submitBtn.addEventListener('click', handleSubmission);
</script>

</body>
</html>
