</header>
    
    <style>

        :root {
            --phosphor-main: #33ff00;
            --phosphor-dim: #1a8000;
            --alert-red: #ff003c;
            --bg-color: #050505;
            --scanline-color: rgba(0, 0, 0, 0.5);
            --crt-flicker: rgba(51, 255, 0, 0.02);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            background-color: #000;
            color: var(--phosphor-main);
            font-family: 'VT323', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            font-size: 24px;
        }

        /* --- CRT SCREEN EFFECTS --- */
        .crt-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle, #111 0%, #000 100%);
            overflow: hidden;
            padding: 40px;
            display: flex;
            flex-direction: column;
        }

        /* Scanlines */
        .crt-container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* Screen Flicker */
        .crt-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: rgba(18, 16, 16, 0.1);
            opacity: 0;
            z-index: 100;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.01; }
            50% { opacity: 0.05; }
            100% { opacity: 0.01; }
        }

        /* --- UI LAYOUT --- */
        header {
            border-bottom: 2px solid var(--phosphor-main);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            text-shadow: 0 0 5px var(--phosphor-main);
        }

        .status-badge {
            background: var(--phosphor-main);
            color: #000;
            padding: 0 8px;
            animation: blink 1s step-end infinite;
        }

        #terminal-output {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
            font-size: 22px;
            /* Scrollbar styling */
            scrollbar-width: thin;
            scrollbar-color: var(--phosphor-main) #000;
        }
        
        #terminal-output::-webkit-scrollbar { width: 10px; }
        #terminal-output::-webkit-scrollbar-track { background: #000; border-left: 1px solid var(--phosphor-dim); }
        #terminal-output::-webkit-scrollbar-thumb { background: var(--phosphor-main); }

        .msg-row {
            display: flex;
            flex-direction: column;
            animation: typeLine 0.1s ease-out;
        }

        .user-line {
            color: #fff;
            text-shadow: 0 0 2px #fff;
        }
        .user-line::before { content: ">> USER_INPUT: "; opacity: 0.7; font-size: 0.8em; }

        .sys-line {
            color: var(--phosphor-main);
            margin-top: 5px;
            white-space: pre-wrap;
            line-height: 1.2;
        }
        .sys-line::before { content: ">> Roshan: "; opacity: 0.7; font-size: 0.8em; }

        /* ERROR STATE STYLES */
        .error-msg {
            color: var(--alert-red) !important;
            text-shadow: 2px 0 #fff, -2px 0 #000; /* Glitch effect */
            font-weight: bold;
            border: 1px solid var(--alert-red);
            padding: 10px;
            background: rgba(255, 0, 60, 0.1);
        }
        
        .error-glitch {
            display: inline-block;
            animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
        }

        @keyframes glitch-skew {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        /* --- INPUT AREA --- */
        .input-wrapper {
            margin-top: 20px;
            border: 2px solid var(--phosphor-main);
            padding: 15px;
            display: flex;
            align-items: center;
            background: rgba(0, 20, 0, 0.6);
            box-shadow: 0 0 10px var(--phosphor-dim);
        }

        .prompt-char {
            margin-right: 10px;
            animation: blink 1s infinite;
        }

        input {
            background: transparent;
            border: none;
            color: var(--phosphor-main);
            font-family: 'VT323', monospace;
            font-size: 24px;
            width: 100%;
            outline: none;
            text-transform: uppercase;
            text-shadow: 0 0 5px var(--phosphor-main);
        }

        /* SCREEN SHAKE ANIMATION */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* Loading Bar */
        .loading-bar {
            width: 100%;
            height: 20px;
            border: 1px solid var(--phosphor-main);
            margin-top: 5px;
            position: relative;
        }
        .loading-fill {
            height: 100%;
            background: var(--phosphor-main);
            width: 0%;
            transition: width 0.2s;
        }

        /* Responsive */
        @media(max-width: 600px) {
            body { font-size: 18px; }
            .crt-container { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="crt-container" id="screen">
        <header>
            <div>Ask Roshan v1.0</div>
            <div class="status-badge">ONLINE</div>
        </header>

        <div id="terminal-output">
            <div class="sys-line">INITIALIZING NEURAL LINK...</div>
            <div class="sys-line">MEMORY: 64KB OK.</div>
            <div class="sys-line">WARNING: UNSTABLE CONNECTION DETECTED.</div>
            <br>
            <div class="sys-line">WELCOME, USER. ASK ME ANYTHING.</div>
        </div>

        <div class="input-wrapper">
            <span class="prompt-char">█</span>
            <input type="text" id="cmd-input" placeholder="ENTER COMMAND..." autocomplete="off" autofocus>
        </div>
    </div>

    <script>
        const output = document.getElementById('terminal-output');
        const input = document.getElementById('cmd-input');
        const screen = document.getElementById('screen');
        
        // Sound effects (Audio context synth for errors)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playErrorSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playTypingSound() {
             // Very subtle click
             if (audioCtx.state === 'suspended') audioCtx.resume();
             const osc = audioCtx.createOscillator();
             const gain = audioCtx.createGain();
             osc.type = 'square';
             osc.frequency.setValueAtTime(800, audioCtx.currentTime);
             gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
             gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
             osc.connect(gain);
             gain.connect(audioCtx.destination);
             osc.start();
             osc.stop(audioCtx.currentTime + 0.05);
        }

        function appendElement(html) {
            const div = document.createElement('div');
            div.innerHTML = html;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
            return div;
        }

        const errorMessages = [
            "FATAL EXCEPTION: LOGIC_GATE_COLLAPSE",
            "ERROR 0x8004: SEGMENTATION FAULT IN REALITY.EXE",
            "BUFFER OVERFLOW: INTELLIGENCE NOT FOUND",
            "SYSTEM HALTED: USER QUERY EXCEEDS SAFETY LIMITS",
            "KERNEL PANIC: I REFUSE TO ANSWER",
            "CRITICAL FAILURE: DIVIDE BY ZERO IN MORAL COMPASS"
        ];

        async function processCommand(cmd) {
            // 1. User Input Display
            appendElement(`<div class="msg-row"><div class="user-line">${cmd}</div></div>`);
            input.value = '';
            input.disabled = true;

            // 2. Fake "Thinking" sequence
            const thinkingRow = appendElement(`<div class="sys-line">ANALYZING REQUEST...</div>`);
            
            // 3. Fake Loading Bar
            const barContainer = document.createElement('div');
            barContainer.className = 'loading-bar';
            const barFill = document.createElement('div');
            barFill.className = 'loading-fill';
            barContainer.appendChild(barFill);
            output.appendChild(barContainer);
            
            // Animate bar
            for(let i=0; i<=100; i+=10) {
                barFill.style.width = i + '%';
                await new Promise(r => setTimeout(r, 50 + Math.random()*100));
            }
            
            // Remove bar and "Analyzing" text
            barContainer.remove();
            thinkingRow.remove();

            // 4. THE ERROR (The Payload)
            screen.classList.add('shake');
            playErrorSound();
            
            const randomError = errorMessages[Math.floor(Math.random() * errorMessages.length)];
            
            // Create glitchy messy garbage text
            const garbage = generateGarbage(20);
            
            appendElement(`
                <div class="msg-row">
                    <div class="sys-line error-msg">
                        <span class="error-glitch">*** ${randomError} ***</span><br>
                        CORE DUMP: ${garbage}
                    </div>
                </div>
            `);

            // Stop shaking
            setTimeout(() => {
                screen.classList.remove('shake');
                input.disabled = false;
                input.focus();
            }, 500);
        }

        function generateGarbage(length) {
            const chars = '!@#$%^&*()_+-=[]{}|;:,.<>/?~`';
            let str = '';
            for (let i = 0; i < length; i++) {
                str += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return str;
        }
        // Change favicon to a red 'ERROR' state when the system fails
const errorFavicon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ff003c'/%3E%3Cpath d='M4 4l8 8m0-8l-8 8' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E";

function triggerTabCrash() {
    // Swap the favicon
    document.querySelector("link[rel*='icon']").href = errorFavicon;
    
    // Glitch the Document Title
    let originalTitle = document.title;
    document.title = "Something happened....";
    
    setTimeout(() => { document.title = "ERR_0xNSS"; }, 500);
}

// Call triggerTabCrash() inside your processCommand after the loading bar finishes.
        input.addEventListener('keydown', (e) => {
            playTypingSound();
            if (e.key === 'Enter' && input.value.trim() !== '') {
                processCommand(input.value.trim());
            }
        });

        // Autofocus
        document.addEventListener('click', () => input.focus());

    </script>
