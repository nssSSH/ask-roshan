<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Roshan | AI Assistant</title>

<style>
:root {
  --bg-color: #ffffff;
  --text-primary: #0d0d0d;
  --text-secondary: #676767;
  --border-color: #e5e5e5;
  --user-msg-bg: #f4f4f4;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
  background-color: var(--bg-color);
  color: var(--text-primary);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

.main-container {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
}

header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border-color);
  background: #fff;
}

header h1 {
  font-size: 1.2rem;
  font-weight: 600;
}

#chat-window {
  flex: 1;
  overflow-y: auto;
  padding: 24px 0;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.message-row {
  width: 100%;
  display: flex;
  padding: 0 24px;
}

.message-content {
  max-width: 800px;
  margin: 0 auto;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.user-message {
  background-color: var(--user-msg-bg);
  padding: 12px 16px;
  border-radius: 18px;
  align-self: flex-end;
  max-width: 70%;
  word-wrap: break-word;
}

.assistant-message {
  align-self: flex-start;
  line-height: 1.6;
}

.input-area {
  padding: 24px;
  border-top: 1px solid var(--border-color);
  background: #fff;
}

.input-container {
  max-width: 800px;
  margin: 0 auto;
}

.description {
  font-size: 0.85rem;
  color: var(--text-secondary);
  text-align: center;
  margin-bottom: 16px;
}

.input-wrapper {
  display: flex;
  align-items: flex-end;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 10px;
  background: #fff;
}

textarea {
  flex: 1;
  border: none;
  outline: none;
  resize: none;
  padding: 8px;
  font-size: 1rem;
  max-height: 200px;
  min-height: 24px;
}

button {
  background-color: var(--text-primary);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 8px 12px;
  cursor: pointer;
  font-weight: 500;
}

button:disabled {
  background-color: var(--border-color);
  cursor: not-allowed;
}

.label {
  font-weight: 700;
  font-size: 0.75rem;
  text-transform: uppercase;
  margin-bottom: 4px;
}
</style>
</head>

<body>

<div class="main-container">
  <header>
    <h1>Ask Roshan</h1>
  </header>

  <main id="chat-window"></main>

  <footer class="input-area">
    <div class="input-container">
      <p class="description">
        Ask Roshan is an AI assistant designed to help with information, analysis, and tasks.
      </p>
      <div class="input-wrapper">
        <textarea id="user-input" placeholder="Message Ask Roshan..." rows="1"></textarea>
        <button id="send-btn">Send</button>
      </div>
    </div>
  </footer>
</div>

<script>
const chatWindow = document.getElementById('chat-window');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

function createMessage(text, isUser) {
  const row = document.createElement('div');
  row.className = 'message-row';

  const content = document.createElement('div');
  content.className = 'message-content';

  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = isUser ? 'You' : 'Ask Roshan';

  const msg = document.createElement('div');
  msg.className = isUser ? 'user-message' : 'assistant-message';
  msg.textContent = text;

  content.appendChild(label);
  content.appendChild(msg);
  row.appendChild(content);
  return row;
}

function handleSend() {
  const text = userInput.value.trim();
  if (!text) return;

  chatWindow.appendChild(createMessage(text, true));
  userInput.value = '';
  userInput.style.height = 'auto';

  setTimeout(() => {
    chatWindow.appendChild(
      createMessage("There was a error getting response. Try again later", false)
    );
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }, 100);

  chatWindow.scrollTop = chatWindow.scrollHeight;
}

sendBtn.addEventListener('click', handleSend);

userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

userInput.addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = this.scrollHeight + 'px';
});
</script>

</body>
</html>
